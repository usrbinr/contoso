$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/

name: contoso_reports
label: Contoso business reports
description: >
  1,127 fictional internal business documents about Contoso's trading from
  18 May 2016 (when the data starts) to the end of 2025: weekly sales
  flashes, monthly e-commerce, supply chain and plant reviews, quarterly
  regional reviews, pricing committee minutes, operations notices, external
  industry notes and each year's Annual Operating Plan (from 2017). Returned
  by `contoso::read_reports()`. Each row is one report, published between 30
  May 2016 and 21 January 2026.

details: |
  This dataset is **synthetic**. The companies, people and events are
  fictional. The text was generated by a large language model from a
  scripted scenario, with every Contoso figure computed from the contoso
  "mega" dataset (`create_contoso_duckdb("mega")`), not the bundled tables,
  which end in 2024.

  ## Some reports are deliberately wrong

  A few reports misread the data or credit the wrong cause, as real business
  writing does. They are there for testing financial planning and analysis
  (FP&A) assistants, and are not marked. Check claims against the data rather
  than trusting the text.

  ## Use `published` for "as of" questions

  Each author only knows what had happened by the publication date. To see
  what was known on a date, filter on `published`, not on the period dates.

  ## One story across ten years

  The years form one continuous, fictional history: a new sales system in
  2016, store openings and closures in 2016-2019, a loyalty programme in 2019,
  a component shortage in 2020-2021, marketplaces in 2022-2024, the record
  2023 and the difficult 2024, then the 2025 programmes. People change roles
  over time, so a unit's author depends on the publication date.

  The glossary in `system.file("extdata", "reports", "glossary.yaml",
  package = "contoso")` defines the terms the reports use, with the
  phrasings to search for.

origin: https://codeberg.org/usrbinr/contoso

version:
  date: 2026-10-27

tables:
  - name: reports
    source:
      parquet: ../../../data-raw/reports.parquet
    columns:
      - name: id
        type: string
        constraints: [primary_key]
        description: >
          Unique report identifier: the report type, the period and, where
          needed, the region or week, e.g. `regional-us-2025-q2`. Also the file
          name used by `export_reports()`.
        examples:
          - aop-2025
          - sales-flash-2025-w20
          - ecommerce-2025-06
          - regional-us-2025-q2
          - supply-alert-2025-03-10
          - sales-flash-2020-w08
          - ops-notice-2018-08-13

      - name: title
        type: string
        constraints: [required, unique]
        description: The report's title, as it appears at the top of `body`.
        examples:
          - 2025 Annual Operating Plan - Summary
          - Weekly Sales Flash - Week 20 (12 May 2025 to 18 May 2025)
          - E-commerce Performance Review - June 2025

      - name: unit
        type: enum
        constraints: [required]
        description: >
          The business unit that wrote the report. Northbridge Retail Insights
          is an outside analyst with no access to Contoso's internal data.
        values:
          - Corporate Planning
          - Sales Operations
          - Digital Commerce
          - "Supply Chain & Procurement"
          - Contoso Manufacturing (Private Label)
          - "Pricing & Promotions Committee"
          - Regional Sales - United States
          - Regional Sales - Germany
          - Regional Sales - United Kingdom
          - Regional Sales - Canada
          - Retail Operations
          - Northbridge Retail Insights (external)

      - name: author
        type: enum
        constraints: [required]
        description: >
          The named author and their job title: whoever held the role on the
          publication date. Most roles change hands once between 2016 and
          2025 (Manufacturing, Canada and the industry analyst never do), and
          the VP Supply Chain & Procurement also writes the supply alerts. All
          names are fictional.
        values:
          - "Benjamin Castellanos, Director of Sales Operations"
          - "Carl Mendes, VP Sales, United States"
          - "Dana Whitfield, VP Sales, United States"
          - "Daniel Okoye, Head of Corporate Planning"
          - "Etienne Roy, Country Manager, Canada"
          - "Fiona Gallagher, Country Manager, United Kingdom"
          - "Hannah Okafor, VP Supply Chain & Procurement"
          - "Inès Duarte, Head of Online"
          - "Lukas Brandt, Country Manager, Germany"
          - "Marcus Lindqvist, Head of E-commerce"
          - "Margaret Holloway, Head of Corporate Planning"
          - "Northbridge Retail Insights, Consumer Electronics Practice"
          - "Oliver Pennington, Country Manager, United Kingdom"
          - "Olivia Grant, Chief Commercial Officer (Chair)"
          - "Priya Raman, Director of Sales Operations"
          - "Robert Ashdown, Chief Commercial Officer (Chair)"
          - "Ruth Nakamura, VP Retail Operations"
          - "Sabine Kröger, Country Manager, Germany"
          - "Sam Achterberg, VP Retail Operations"
          - "Tomasz Wisniewski, Plant Director, Contoso, Ltd"
          - "Victor Adeyemi, VP Supply Chain & Procurement"

      - name: report_type
        type: enum
        constraints: [required]
        description: The kind of report, which sets its template, period and timing.
        details: |
          | Type | Report | Period | A full year | 2016-2025 |
          |---|---|---|---|---|
          | `sales_flash` | Weekly Sales Flash | ISO week (Monday to Sunday) | 52 (53 in 2020) | 501 |
          | `ecommerce` | E-commerce Performance Review | Month | 12 | 115 |
          | `supply_chain` | Vendor & Supply Review | Month | 12 | 115 |
          | `manufacturing` | Contoso, Ltd Plant Report | Month | 12 | 115 |
          | `regional` | Quarterly Business Review, one per country | Quarter | 16 | 152 |
          | `pricing` | Pricing & Promotions Committee Minutes | The 8 weeks before the meeting | 5 | 48 |
          | `industry` | External sector review | Quarter | 4 | 38 |
          | `alert` | Supply alert or operations notice | One day | 2-5 | 34 |
          | `aop` | Annual Operating Plan memo | Full year, from 2017 | 1 | 9 |

          2016 is a partial year: weekly flashes from ISO week 21, monthly
          reports from June, quarterly reports for Q3 and Q4, and no plan.
        values:
          - sales_flash
          - ecommerce
          - supply_chain
          - manufacturing
          - regional
          - pricing
          - industry
          - alert
          - aop

      - name: period_start
        type: date
        constraints: [required]
        description: First day of the period the report covers.
        range: [2016-05-23, 2025-12-22]

      - name: period_end
        type: date
        constraints: [required]
        description: Last day of the period the report covers.
        range: [2016-05-29, 2025-12-31]

      - name: published
        type: date
        constraints: [required]
        description: >
          The date the report was released. The author knows only what had
          happened by this date. Usually after `period_end`; each plan memo is
          published in December of the year before the one it covers, and
          alerts on the day of the event.
        range: [2016-05-30, 2026-01-21]

      - name: body
        type: string
        constraints: [required]
        description: >
          The full report text in Markdown, starting with the title as a
          level-1 heading and a line naming the author, unit and publication
          date. Between about 300 and 1,100 words.
        examples:
          - "# Weekly Sales Flash - Week 20 (12 May 2025 to 18 May 2025)\nPriya Raman, …"

glossary:
  AOP: >
    Annual Operating Plan: each year's budget from 2017, set by month,
    country and category. "vs budget" and "vs plan" in the reports mean
    against the AOP.
  "FP&A": >
    Financial planning and analysis: the finance function that explains
    actual results against budget and last year.
  "Store Next": >
    A fictional programme, announced in December 2024, that refits Contoso
    stores with experience zones, rolled out by country in waves through
    2025.
  "Contoso, Ltd": >
    Contoso's own private-label manufacturing arm, which makes some of the
    products it sells. Also listed as a manufacturer in the data.
  Online: >
    Contoso's online store. Reported as its own "country" alongside the eight
    store countries.
