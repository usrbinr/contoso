$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/

name: contoso_reports
label: Contoso business reports
description: >
  118 fictional internal business documents about Contoso's 2025 trading:
  weekly sales flashes, monthly e-commerce, supply chain and plant reviews,
  quarterly regional reviews, pricing committee minutes, operations notices,
  external industry notes and the 2025 Annual Operating Plan. Returned by
  `contoso::read_reports()`. Each row is one report, published between 16
  December 2024 and 21 January 2026.

details: |
  This dataset is **synthetic**. The companies, people and events are
  fictional. The text was generated by a large language model from a
  scripted scenario, with every Contoso figure computed from the contoso
  "mega" dataset (`create_contoso_duckdb("mega")`), not the bundled tables,
  which end in 2024.

  ## Some reports are deliberately wrong

  A few reports misread the data or credit the wrong cause, as real business
  writing does. They are there for testing financial planning and analysis
  (FP&A) assistants, and are not marked. Check claims against the data rather
  than trusting the text.

  ## Use `published` for "as of" questions

  Each author only knows what had happened by the publication date. To see
  what was known on a date, filter on `published`, not on the period dates.

origin: https://codeberg.org/usrbinr/contoso

version:
  date: 2026-10-16

tables:
  - name: reports
    source:
      parquet: ../../../data-raw/reports.parquet
    columns:
      - name: id
        type: string
        constraints: [primary_key]
        description: >
          Unique report identifier: the report type, the period and, where
          needed, the region or week, e.g. `regional-us-2025-q2`. Also the file
          name used by `export_reports()`.
        examples:
          - aop-2025
          - sales-flash-2025-w20
          - ecommerce-2025-06
          - regional-us-2025-q2
          - supply-alert-2025-03-10

      - name: title
        type: string
        constraints: [required, unique]
        description: The report's title, as it appears at the top of `body`.
        examples:
          - 2025 Annual Operating Plan - Summary
          - Weekly Sales Flash - Week 20 (12 May 2025 to 18 May 2025)
          - E-commerce Performance Review - June 2025

      - name: unit
        type: enum
        constraints: [required]
        description: >
          The business unit that wrote the report. Northbridge Retail Insights
          is an outside analyst with no access to Contoso's internal data.
        values:
          - Corporate Planning
          - Sales Operations
          - Digital Commerce
          - "Supply Chain & Procurement"
          - Contoso Manufacturing (Private Label)
          - "Pricing & Promotions Committee"
          - Regional Sales - United States
          - Regional Sales - Germany
          - Regional Sales - United Kingdom
          - Regional Sales - Canada
          - Retail Operations
          - Northbridge Retail Insights (external)

      - name: author
        type: enum
        constraints: [required]
        description: >
          The named author and their job title. Each unit has one author all
          year, except Supply Chain & Procurement, whose VP also writes the
          supply alerts. All names are fictional.
        values:
          - "Daniel Okoye, Head of Corporate Planning"
          - "Priya Raman, Director of Sales Operations"
          - "Marcus Lindqvist, Head of E-commerce"
          - "Hannah Okafor, VP Supply Chain & Procurement"
          - "Tomasz Wisniewski, Plant Director, Contoso, Ltd"
          - "Olivia Grant, Chief Commercial Officer (Chair)"
          - "Dana Whitfield, VP Sales, United States"
          - "Lukas Brandt, Country Manager, Germany"
          - "Fiona Gallagher, Country Manager, United Kingdom"
          - "Etienne Roy, Country Manager, Canada"
          - "Sam Achterberg, VP Retail Operations"
          - "Northbridge Retail Insights, Consumer Electronics Practice"

      - name: report_type
        type: enum
        constraints: [required]
        description: The kind of report, which sets its template, period and timing.
        details: |
          | Type | Report | Period | Count |
          |---|---|---|---|
          | `sales_flash` | Weekly Sales Flash | Week (Monday to Sunday) | 52 |
          | `ecommerce` | E-commerce Performance Review | Month | 12 |
          | `supply_chain` | Vendor & Supply Review | Month | 12 |
          | `manufacturing` | Contoso, Ltd Plant Report | Month | 12 |
          | `regional` | Quarterly Business Review, one per country | Quarter | 16 |
          | `pricing` | Pricing & Promotions Committee Minutes | The 8 weeks before the meeting | 5 |
          | `industry` | External sector review | Quarter | 4 |
          | `alert` | Supply alert or operations notice | One day | 4 |
          | `aop` | Annual Operating Plan memo | Full year 2025 | 1 |
        values:
          - sales_flash
          - ecommerce
          - supply_chain
          - manufacturing
          - regional
          - pricing
          - industry
          - alert
          - aop

      - name: period_start
        type: date
        constraints: [required]
        description: First day of the period the report covers.
        range: [2024-12-04, 2025-12-22]

      - name: period_end
        type: date
        constraints: [required]
        description: Last day of the period the report covers.
        range: [2025-01-05, 2025-12-31]

      - name: published
        type: date
        constraints: [required]
        description: >
          The date the report was released. The author knows only what had
          happened by this date. Usually after `period_end`; the plan memo is
          published in December 2024, before the year it covers, and alerts
          on the day of the event.
        range: [2024-12-16, 2026-01-21]

      - name: body
        type: string
        constraints: [required]
        description: >
          The full report text in Markdown, starting with the title as a
          level-1 heading and a line naming the author, unit and publication
          date. Between about 300 and 1,100 words.
        examples:
          - "# Weekly Sales Flash - Week 20 (12 May 2025 to 18 May 2025)\nPriya Raman, …"

glossary:
  AOP: >
    Annual Operating Plan: the 2025 budget, set by month, country and
    category. "vs budget" and "vs plan" in the reports mean against the AOP.
  "FP&A": >
    Financial planning and analysis: the finance function that explains
    actual results against budget and last year.
  "Store Next": >
    A fictional 2025 programme that refits Contoso stores with experience
    zones, rolled out by country in waves through the year.
  "Contoso, Ltd": >
    Contoso's own private-label manufacturing arm, which makes some of the
    products it sells. Also listed as a manufacturer in the data.
  Online: >
    Contoso's online store. Reported as its own "country" alongside the eight
    store countries.
