project:
  type: website
  output-dir: docs
  render:
  - '*.qmd'
  - '*.md'
  - '!inst/'
  - '!renv/'
  - '!packrat/'
website:
  title: contoso
  navbar:
    title: contoso 2.0.0
    left:
    - text: Reference
      href: reference.qmd
    - text: Citation
      href: citation.qmd
    - text: Changelog
      href: NEWS.md
    logo: man/figures/logo.png
    right:
    - icon: git
      href: https://codeberg.org/usrbinr/contoso
      aria-label: Source code
  page-footer:
    left: Built with [Quarto](https://quarto.org/) and [qrtdown](https://codeberg.org/usrbinr/qrtdown)
    right: contoso 2.0.0
  repo-url: https://codeberg.org/usrbinr/contoso/
format:
  html:
    theme:
      light: cosmo
    toc: true
    code-overflow: wrap

