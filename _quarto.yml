project:
  type: website
  output-dir: docs
  resources:
  - man/figures/**
  render:
  - index.qmd
  - _qrtdown/reference.qmd
  - _qrtdown/reference/*.qmd
  - _qrtdown/articles.qmd
  - _qrtdown/citation.qmd
  - vignettes/articles/*.qmd
  - vignettes/articles/*.md
  - NEWS.md
  - '!inst/'
  - '!renv/'
  - '!packrat/'
  - '!README.qmd'
  - '!README.Rmd'
  - '!README.md'
execute:
  freeze: auto
website:
  title: contoso
  navbar:
    title: contoso 2.1.0
    left:
    - text: Reference
      href: reference.qmd
    - text: Citation
      href: citation.qmd
    - text: Changelog
      href: NEWS.md
    logo: man/figures/logo.png
    right:
    - icon: git
      href: https://codeberg.org/usrbinr/contoso
      aria-label: Source code
  page-footer:
    left: Built with [Quarto](https://quarto.org/) and [qrtdown](https://codeberg.org/usrbinr/qrtdown)
    right: contoso 2.1.0
  repo-url: https://usrbinr.codeberg.page/contoso/
format:
  html:
    theme:
      light: cosmo
    toc: true
    code-overflow: wrap
    css: _qrtdown-styles.css

